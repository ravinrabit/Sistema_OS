{% load static %}
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nova OS - {{ cliente.nome }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="{% url 'cliente_area' %}">
                <i class="bi bi-arrow-left"></i> Voltar
            </a>
            <span class="text-white">
                <i class="bi bi-person-circle"></i> {{ cliente.nome }}
            </span>
        </div>
    </nav>
    
    <div class="container py-4">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card">
                    <div class="card-header">
                        <h4 class="mb-0">
                            <i class="bi bi-plus-circle"></i> Solicitar Nova Ordem de Serviço
                        </h4>
                    </div>
                    <div class="card-body">
                        <form method="POST">
                            {% csrf_token %}
                            
                            <div class="mb-3">
                                <label for="descricao_problema" class="form-label">
                                    Descreva o Problema <span class="text-danger">*</span>
                                </label>
                                <textarea class="form-control" id="descricao_problema" 
                                          name="descricao_problema" rows="5" required
                                          placeholder="Descreva detalhadamente o problema ou serviço que você precisa..."></textarea>
                            </div>
                            
                            <div class="row mb-3">
                                <div class="col-md-6">
                                    <label for="prioridade" class="form-label">Prioridade</label>
                                    <select class="form-select" id="prioridade" name="prioridade">
                                        <option value="baixa">Baixa - Sem pressa</option>
                                        <option value="media" selected>Média - Normal</option>
                                        <option value="alta">Alta - Urgente</option>
                                        <option value="urgente">Urgente - Muito Crítico</option>
                                    </select>
                                </div>
                                
                                <div class="col-md-6">
                                    <label class="form-label">Valor Estimado (se souber)</label>
                                    <div class="input-group">
                                        <span class="input-group-text">R$</span>
                                        <input type="number" class="form-control" name="valor_servico" 
                                               step="0.01" placeholder="0,00">
                                    </div>
                                </div>
                            </div>
                            
                            <div class="mb-3">
                                <label for="observacoes" class="form-label">Observações Adicionais</label>
                                <textarea class="form-control" id="observacoes" name="observacoes" 
                                          rows="3" placeholder="Informações extras que possam ajudar..."></textarea>
                            </div>
                            
                            <div class="alert alert-info">
                                <i class="bi bi-info-circle"></i>
                                Sua solicitação será analisada pela nossa equipe e você receberá um retorno em breve.
                            </div>
                            
                            <div class="d-grid gap-2 d-md-flex justify-content-md-end">
                                <a href="{% url 'cliente_area' %}" class="btn btn-secondary">
                                    <i class="bi bi-x-circle"></i> Cancelar
                                </a>
                                <button type="submit" class="btn btn-primary">
                                    <i class="bi bi-send"></i> Enviar Solicitação
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
