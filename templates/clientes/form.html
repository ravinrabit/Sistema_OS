{% extends 'base.html' %}

{% block titulo %}{{ titulo }} - Sistema OS{% endblock %}

{% block content %}
<div class="row mb-4">
    <div class="col">
        <h2><i class="bi bi-{% if cliente %}pencil{% else %}plus-circle{% endif %}"></i> {{ titulo }}</h2>
    </div>
    <div class="col text-end">
        <a href="{% url 'cliente_lista' %}" class="btn btn-secondary">
            <i class="bi bi-arrow-left"></i> Voltar
        </a>
    </div>
</div>

<div class="card">
    <div class="card-body">
        <form method="POST">
            {% csrf_token %}
            
            <div class="row g-3">
                <!-- Nome -->
                <div class="col-md-8">
                    <label for="nome" class="form-label">Nome Completo *</label>
                    <input type="text" class="form-control" id="nome" name="nome" 
                           value="{{ cliente.nome|default:'' }}" required>
                </div>
                
                <!-- CPF/CNPJ -->
                <div class="col-md-4">
                    <label for="cpf_cnpj" class="form-label">CPF/CNPJ *</label>
                    <input type="text" class="form-control" id="cpf_cnpj" name="cpf_cnpj" 
                           value="{{ cliente.cpf_cnpj|default:'' }}" required>
                </div>
                
                <!-- Email -->
                <div class="col-md-6">
                    <label for="email" class="form-label">E-mail *</label>
                    <input type="email" class="form-control" id="email" name="email" 
                           value="{{ cliente.email|default:'' }}" required>
                </div>
                
                <!-- Telefone -->
                <div class="col-md-3">
                    <label for="telefone" class="form-label">Telefone *</label>
                    <input type="text" class="form-control" id="telefone" name="telefone" 
                           value="{{ cliente.telefone|default:'' }}" required>
                </div>
                
                <!-- Celular -->
                <div class="col-md-3">
                    <label for="celular" class="form-label">Celular</label>
                    <input type="text" class="form-control" id="celular" name="celular" 
                           value="{{ cliente.celular|default:'' }}">
                </div>
                
                <!-- CEP -->
                <div class="col-md-3">
                    <label for="cep" class="form-label">CEP *</label>
                    <input type="text" class="form-control" id="cep" name="cep" 
                           value="{{ cliente.cep|default:'' }}" required>
                </div>
                
                <!-- Endereço -->
                <div class="col-md-6">
                    <label for="endereco" class="form-label">Endereço *</label>
                    <input type="text" class="form-control" id="endereco" name="endereco" 
                           value="{{ cliente.endereco|default:'' }}" required>
                </div>
                
                <!-- Cidade -->
                <div class="col-md-3">
                    <label for="cidade" class="form-label">Cidade *</label>
                    <input type="text" class="form-control" id="cidade" name="cidade" 
                           value="{{ cliente.cidade|default:'' }}" required>
                </div>
                
                <!-- Estado -->
                <div class="col-md-3">
                    <label for="estado" class="form-label">Estado *</label>
                    <input type="text" class="form-control" id="estado" name="estado" 
                           value="{{ cliente.estado|default:'' }}" maxlength="2" required>
                </div>
                
                <!-- Observações -->
                <div class="col-12">
                    <label for="observacoes" class="form-label">Observações</label>
                    <textarea class="form-control" id="observacoes" name="observacoes" 
                              rows="3">{{ cliente.observacoes|default:'' }}</textarea>
                </div>
            </div>
            
            <div class="mt-4">
                <button type="submit" class="btn btn-primary">
                    <i class="bi bi-check-lg"></i> Salvar
                </button>
                <a href="{% url 'cliente_lista' %}" class="btn btn-secondary">
                    Cancelar
                </a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
